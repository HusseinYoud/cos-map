<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barovia World Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Georgia, serif;
      background: #111;
      color: #f2f2f2;
    }

    #map {
      width: 100%;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    .info-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 360px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: rgba(15, 15, 15, 0.96);
      color: #f2f2f2;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 1rem;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      transform: translateX(0);
      transition: width 0.25s ease, height 0.25s ease, transform 0.25s ease;
    }

    .info-panel.hidden {
      display: none;
    }

    .info-panel.expanded {
      width: 78vw;
      height: calc(100vh - 40px);
    }

    .panel-topbar {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .panel-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .panel-btn {
      background: #222;
      color: #f2f2f2;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      cursor: pointer;
    }

    .panel-btn:hover {
      background: #333;
    }

    .entry-type {
      display: inline-block;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
      color: #c6c6c6;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .entry-list {
      padding-left: 1.2rem;
      margin-top: 0.4rem;
      margin-bottom: 1rem;
    }

    .entry-list li {
      margin-bottom: 0.35rem;
    }

    .entry-link {
      color: #d8c38a;
      text-decoration: none;
      cursor: pointer;
    }

    .entry-link:hover {
      text-decoration: underline;
    }

    .read-more-btn,
    .back-btn {
      display: inline-block;
      margin-top: 0.8rem;
      background: #2b2b2b;
      color: #f2f2f2;
      text-decoration: none;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
    }

    .read-more-btn:hover,
    .back-btn:hover {
      background: #3a3a3a;
    }

    h2, h3 {
      margin-top: 0;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(20,20,20,0.95);
      color: #f2f2f2;
      border-radius: 10px;
    }

    .leaflet-popup-tip {
      background: rgba(20,20,20,0.95);
    }

    .popup-link {
      color: #d8c38a;
      text-decoration: none;
      cursor: pointer;
    }

    .popup-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="info-panel" class="info-panel hidden">
    <div class="panel-topbar">
      <strong>Entry</strong>
      <div class="panel-buttons">
        <button id="expand-panel" class="panel-btn">Expand</button>
        <button id="close-panel" class="panel-btn">Close</button>
      </div>
    </div>
    <div id="panel-content"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
