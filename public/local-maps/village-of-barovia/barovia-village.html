<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Village of Barovia</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Georgia, serif;
      background: #111;
      color: #f2f2f2;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .top-left-controls {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1100;
    }

    .nav-btn {
      display: inline-block;
      background: rgba(15, 15, 15, 0.95);
      color: #f2f2f2;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
    }

    .nav-btn:hover {
      background: #2b2b2b;
    }

    .info-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 360px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: rgba(15, 15, 15, 0.96);
      color: #f2f2f2;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 1rem;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }

    .entry-type {
      display: inline-block;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
      color: #c6c6c6;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .sub-panel {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    .sub-panel h3 {
      margin: 0 0 0.6rem 0;
      font-size: 1rem;
      color: #e8e8e8;
    }

    .coord-line {
      margin: 0.25rem 0;
      font-family: monospace;
      font-size: 0.95rem;
      color: #d6d6d6;
    }

    .coord-hint {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #9f9f9f;
    }
  </style>
</head>
<body>
  <div class="top-left-controls">
    <a href="#" id="back-link" class="nav-btn">Back to world map</a>
  </div>

  <div id="map"></div>

  <div class="info-panel">
    <h2>Village of Barovia</h2>
    <div class="entry-type">Local Map</div>
    <p>
      This is the zoomed-in local map for the Village of Barovia.
      From here you can add building markers, local NPCs, rumors, quests, and hidden notes.
    </p>

    <div class="sub-panel" id="debug-coordinates">
      <h3>Debug Coordinates</h3>
      <div class="coord-line">x: -</div>
      <div class="coord-line">y: -</div>
      <div class="coord-hint">Click anywhere on the map to inspect coordinates.</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const basePath = window.location.hostname.endsWith("github.io")
      ? "/cos-map/"
      : "/";

    document.getElementById("back-link").href = basePath;

    const map = L.map("map", {
      crs: L.CRS.Simple,
      minZoom: -2,
      maxZoom: 3
    });

    const imageWidth = 1950;
    const imageHeight = 2475;
    const bounds = [[0, 0], [imageHeight, imageWidth]];

    L.imageOverlay("./barovia-village.jpg", bounds).addTo(map);
    map.fitBounds(bounds);

    const debugCoordinates = document.getElementById("debug-coordinates");

    map.on("click", (e) => {
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);

      debugCoordinates.innerHTML = `
        <h3>Debug Coordinates</h3>
        <div class="coord-line">x: ${x}</div>
        <div class="coord-line">y: ${y}</div>
        <div class="coord-hint">Latest clicked position on the local map.</div>
      `;

      console.log({ x, y });
    });
  </script>
</body>
</html>
