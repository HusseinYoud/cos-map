<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vallaki</title>

  <body>
    <p>
      Opening Vallaki.
      <a href="../../?map=vallaki">Continue to the map</a>

    <script>

      target.searchParams.set("map", "vallaki");
      window.location.replace(target.href);
